<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launch Point Global Tour — Facility Map</title>

  <!-- Leaflet + MarkerCluster (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Heavy italic display sans for the wordmark echo + clean body sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="header">
    <div class="header-left">
      <button id="sidebar-toggle" class="hamburger" aria-label="Toggle facility list" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
      </button>
      <img id="logo" src="assets/logo.png" alt="Launch Point Global Tour" />
    </div>
    <div id="facility-count" class="count" aria-live="polite">0 FACILITIES</div>
  </header>

  <div id="layout">
    <aside id="sidebar" aria-label="Facility list">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search name or city" aria-label="Search facilities by name or city" autocomplete="off" />
      </div>
      <ul id="facility-list" role="listbox" aria-label="Facilities"></ul>
    </aside>
    <main id="map" aria-label="World map of facilities"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
