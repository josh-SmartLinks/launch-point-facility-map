<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Primary SEO -->
  <title>Launch Point Global Tour — Facility Map</title>
  <meta name="description" content="Interactive world map of Launch Point Global Tour facilities — find golf simulator venues across the US and Canada, then apply to join the tour." />
  <meta name="keywords" content="Launch Point Global Tour, golf simulator, indoor golf, GSPro, Trackman, facility map, golf league" />
  <meta name="author" content="Launch Point Global Tour" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#000000" />
  <link rel="canonical" href="https://www.launchpointglobaltour.com/" />

  <!-- Favicons -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Launch Point Global Tour" />
  <meta property="og:title" content="Launch Point Global Tour — Facility Map" />
  <meta property="og:description" content="Interactive world map of Launch Point Global Tour facilities. Find golf simulator venues across the US and Canada, then apply to join the tour." />
  <meta property="og:url" content="https://www.launchpointglobaltour.com/" />

  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Launch Point Global Tour logo" />

  <!-- Twitter -->

  <meta name="twitter:title" content="Launch Point Global Tour — Facility Map" />
  <meta name="twitter:description" content="Interactive world map of Launch Point Global Tour golf simulator facilities across the US and Canada." />
  <meta name="twitter:image" content="https://www.launchpointglobaltour.com/assets/og-image.png" />

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Launch Point Global Tour",
    "url": "https://www.launchpointglobaltour.com/",
    "logo": "https://www.launchpointglobaltour.com/assets/favicon-512.png",
    "description": "A tour of golf simulator facilities across the US and Canada."
  }
  </script>

  <!-- Leaflet + MarkerCluster (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous" />

  <!-- Heavy italic display sans for the wordmark echo + clean body sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 class="visually-hidden">Launch Point Global Tour — Facility Map</h1>
  <header id="header">
    <div class="header-left">
      <button id="sidebar-toggle" class="hamburger" aria-label="Toggle facility list" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
      </button>
      <img id="logo" src="assets/logo.png" alt="Launch Point Global Tour" />
    </div>
    <div id="facility-count" class="count" aria-live="polite">0 FACILITIES</div>
  </header>

  <div id="layout">
    <aside id="sidebar" aria-label="Facility list">
      <a id="apply-btn" class="apply-btn display" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=047wx5o2pE2cogL4RD3nD5hcF4Ws8uNIs7ABgUGnWiJUQ0FYNTdOS1MySjA4S09MU0FQOEZYVVBXVy4u" target="_blank" rel="noopener noreferrer">APPLY TO JOIN THE TOUR</a>
      <a id="proposal-btn" class="display" href="/proposal.html">READ THE PROPOSAL</a>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search name or city" aria-label="Search facilities by name or city" autocomplete="off" />
      </div>
      <ul id="facility-list" role="listbox" aria-label="Facilities"></ul>
    </aside>
    <main id="map" aria-label="World map of facilities"></main>
  </div>

  <div id="fab-group">
    <a class="fab-item btn-outline display" href="/proposal.html">PROPOSAL</a>
    <a class="fab-item apply-btn display" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=047wx5o2pE2cogL4RD3nD5hcF4Ws8uNIs7ABgUGnWiJUQ0FYNTdOS1MySjA4S09MU0FQOEZYVVBXVy4u" target="_blank" rel="noopener noreferrer">APPLY</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
  <script src="facilities.js"></script>
  <script src="app.js"></script>

  <!-- Vercel Web Analytics (static-site integration; equivalent of @vercel/analytics) -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
